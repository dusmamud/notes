name: note
description: "Modern, fast, and private offline-first Notes application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Theming
  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.0.1
  flutter_slidable: ^3.1.2
  pull_down_button: ^0.10.2
  smooth_sheets: ^0.8.0
  emoji_picker_flutter: ^3.0.0

  # Rich Text & Markdown
  appflowy_editor: any
  markdown: ^7.2.2

  # Persistence & Database
  objectbox: ^4.0.3
  objectbox_flutter_libs: any
  shared_preferences: ^2.3.5

  # Media, Audio & PDF
  record: ^5.2.0
  just_audio: ^0.9.43
  cunning_document_scanner: ^1.3.1
  pdf: ^3.11.1
  pdfrx: ^1.1.8
  image_picker: ^1.1.2

  # Security & Biometrics
  local_auth: ^2.3.0
  encrypt: ^5.0.3

  # Localization, System & Utilities
  easy_localization: ^3.0.7
  intl: ^0.20.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  objectbox_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/

  shaders:
    - assets/shaders/ink_sparkle.frag
    - assets/shaders/stretch_effect.frag

  fonts:
    - family: pretenda
      fonts:
        - asset: assets/fonts/variable.ttf
