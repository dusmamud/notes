name: note
description: "Modern, fast, and private offline-first Notes application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Theming
  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.4.0
  flutter_slidable: ^3.1.2
  smooth_sheets: ^0.8.2
  emoji_picker_flutter: ^3.1.0
  sliver_tools: ^0.2.12
  sprung: ^3.0.1

  # Rich Text, Markdown & Search
  appflowy_editor: any
  markdown: ^7.2.2
  scroll_to_index: ^3.0.1

  # State, Equality & Timing Utilities
  equatable: ^2.0.7
  easy_debounce: ^2.0.3
  nanoid: ^1.0.0
  uuid: ^4.5.1
  rxdart: ^0.28.0

  # Keyboard & Input Handling
  flutter_keyboard_visibility: ^6.0.0
  keyboard_height_plugin: ^0.1.5

  # Persistence & Database
  objectbox: ^4.0.3
  objectbox_flutter_libs: any
  shared_preferences: ^2.3.5

  # Media, Audio & PDF
  record: ^6.2.1
  just_audio: ^0.9.43
  audio_session: ^0.1.25
  cunning_document_scanner: ^1.4.0
  pdf: ^3.11.1
  pdfrx: ^1.1.8
  printing: ^5.13.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  open_filex: ^4.7.0
  archive: ^4.0.2

  # Security & Biometrics
  local_auth: ^2.3.0
  encrypt: ^5.0.3

  # Web & Link Previews
  webview_flutter: ^4.10.0

  # Localization, System & Background Work
  easy_localization: ^3.0.7
  intl: ^0.20.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  permission_handler: ^12.0.3
  workmanager: ^0.10.10
  system_date_time_format: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  objectbox_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/
    - assets/shaders/

  fonts:
    - family: pretenda
      fonts:
        - asset: assets/fonts/variable.ttf
