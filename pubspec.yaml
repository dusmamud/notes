name: note
description: "Modern, fast, and private offline-first Notes application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Theming
  cupertino_icons: ^2.0.0
  cupertino_lists_enhanced: ^0.1.3
  pull_down_button: ^0.10.2
  navigator_resizable: ^3.1.0
  flex_color_scheme: ^8.4.0
  flutter_slidable: ^4.0.3
  smooth_sheets: ^1.3.0
  emoji_picker_flutter: ^4.5.4
  sliver_tools: ^0.2.12
  sprung: ^3.0.1

  # Rich Text, Markdown & Search
  # NOTE: appflowy_editor was REMOVED here (run #26 fix). It is never
  # imported in lib/ or test/ (editor is a plain TextField), yet it pins
  # file_picker ^10.2.0, which blocked the file_picker 13 upgrade needed
  # for the Android 35/36 AAR check in run #25. Its own main-branch
  # pubspec still pins file_picker ^10.3.10, so no appflowy_editor version
  # allows file_picker 13. Re-add it only when the editor actually uses it
  # AND its file_picker constraint allows the file_picker version in use.
  markdown: ^7.2.2
  scroll_to_index: ^3.0.1

  # State, Equality & Timing Utilities
  equatable: ^3.0.0
  easy_debounce: ^2.0.3
  nanoid: ^1.0.0
  uuid: ^4.5.1
  rxdart: ^0.28.0

  # Keyboard & Input Handling
  flutter_keyboard_visibility: ^7.0.1
  keyboard_height_plugin: ^0.1.5

  # Persistence & Database
  objectbox: ^4.1.0
  objectbox_flutter_libs: any
  shared_preferences: ^2.3.5

  # Media, Audio & PDF
  record: ^7.1.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  cunning_document_scanner: ^3.0.4
  pdf: ^3.13.1
  pdfrx: ^2.4.8
  printing: ^5.15.1
  image_picker: ^1.1.2
  file_picker: ^13.3.1
  flutter_image_compress: ^2.4.0
  open_filex: ^5.0.0
  archive: ^4.6.0

  # Security, Crypto & Biometrics
  local_auth: ^3.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Web & Link Previews
  webview_flutter: ^4.10.0

  # Localization, System & Background Work
  easy_localization: ^3.0.7
  intl: ^0.20.2
  # share_plus 13.x (run #27 fix): share_plus 12 pins win32 ^5.5.3, but
  # file_picker 13 needs win32 ^6.0.0, so pub solving failed on win32.
  # share_plus 13.0.0 bumps win32 to 6.0.0 (min Flutter 3.41.6, Dart 3.11,
  # both satisfied by CI Flutter 3.44) and does NOT change the
  # SharePlus.instance.share(ShareParams(text/subject/files)) API used here.
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.5
  permission_handler: ^12.0.3
  workmanager: ^0.10.10
  system_date_time_format: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  objectbox_generator: ^4.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/
    - assets/shaders/

  fonts:
    - family: pretenda
      fonts:
        - asset: assets/fonts/variable.ttf
