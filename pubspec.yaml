name: note
description: "Modern, fast, and private offline-first Notes application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Theming
  cupertino_icons: ^2.0.0
  cupertino_lists_enhanced: ^0.1.3
  pull_down_button: ^0.10.2
  navigator_resizable: ^3.1.0
  flex_color_scheme: ^8.4.0
  flutter_slidable: ^4.0.3
  smooth_sheets: ^1.3.0
  emoji_picker_flutter: ^4.5.4
  sliver_tools: ^0.2.12
  sprung: ^3.0.1

  # Rich Text, Markdown & Search
  appflowy_editor: ^6.2.0
  markdown: ^7.2.2
  scroll_to_index: ^3.0.1

  # State, Equality & Timing Utilities
  equatable: ^3.0.0
  easy_debounce: ^2.0.3
  nanoid: ^1.0.0
  uuid: ^4.5.1
  rxdart: ^0.28.0

  # Keyboard & Input Handling
  flutter_keyboard_visibility: ^7.0.1
  keyboard_height_plugin: ^0.1.5

  # Persistence & Database
  objectbox: ^4.1.0
  objectbox_flutter_libs: any
  shared_preferences: ^2.3.5

  # Media, Audio & PDF
  record: ^7.1.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  cunning_document_scanner: ^3.0.4
  pdf: ^3.13.1
  pdfrx: ^2.4.8
  printing: ^5.15.1
  image_picker: ^1.1.2
  file_picker: ^10.2.4
  flutter_image_compress: ^2.4.0
  open_filex: ^5.0.0
  archive: ^4.6.0

  # Security, Crypto & Biometrics
  local_auth: ^3.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Web & Link Previews
  webview_flutter: ^4.10.0

  # Localization, System & Background Work
  easy_localization: ^3.0.7
  intl: ^0.20.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.2
  permission_handler: ^13.0.2
  workmanager: ^0.10.10
  system_date_time_format: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  objectbox_generator: ^4.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/
    - assets/shaders/

  fonts:
    - family: pretenda
      fonts:
        - asset: assets/fonts/variable.ttf
